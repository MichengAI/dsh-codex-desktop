name: 桌面端打包

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-x64
            runner: windows-latest
            buildArguments: --win --x64
          - name: macOS Apple Silicon
            platform: macos-arm64
            runner: macos-14
            buildArguments: --mac --arm64
          - name: macOS Intel
            platform: macos-x64
            runner: macos-15-intel
            buildArguments: --mac --x64
          - name: Linux x64
            platform: linux-x64
            runner: ubuntu-24.04
            buildArguments: --linux --x64
    steps:
      - name: 检出桌面启动器
        uses: actions/checkout@v4

      - name: 配置 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: 安装 Linux 冒烟依赖
        if: matrix.platform == 'linux-x64'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          sudo apt-get update -q
          sudo apt-get install -yq xvfb lsof
      - name: 导入 macOS 签名证书
        if: startsWith(matrix.platform, 'macos-') && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $certificateValues = @($env:MACOS_CERTIFICATE, $env:MACOS_CERTIFICATE_PASSWORD, $env:MACOS_KEYCHAIN_PASSWORD)
          $configuredCount = @($certificateValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configuredCount -eq 0) {
            Write-Host '未配置 macOS 签名证书，将生成 ad-hoc 签名测试版。'
            exit 0
          }
          if ($configuredCount -ne $certificateValues.Count) {
            throw 'macOS 签名凭据必须同时完整配置或全部留空。'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'macos-signing-certificate.p12'
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:MACOS_CERTIFICATE))
          security create-keychain -p $env:MACOS_KEYCHAIN_PASSWORD build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p $env:MACOS_KEYCHAIN_PASSWORD build.keychain
          security import $certificatePath -k build.keychain -P $env:MACOS_CERTIFICATE_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k $env:MACOS_KEYCHAIN_PASSWORD build.keychain

      - name: 检查 Windows 正式发布签名凭据
        if: matrix.platform == 'windows-x64' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $certificateValues = @($env:CSC_LINK, $env:CSC_KEY_PASSWORD)
          $configuredCount = @($certificateValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configuredCount -eq 0) {
            Write-Host '未配置 Windows 代码签名凭据，继续生成未签名测试版。'
            exit 0
          }
          if ($configuredCount -ne $certificateValues.Count) {
            throw 'Windows 代码签名凭据必须同时完整配置或全部留空。'
          }

      - name: 测试并打包桌面端
        shell: pwsh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          if ('${{ matrix.platform }}' -eq 'windows-x64' -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $env:CSC_LINK = $env:WINDOWS_CERTIFICATE
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
          }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $buildArguments = @('${{ matrix.buildArguments }}' -split '\s+' | Where-Object { $_ })
          $isMacPlatform = '${{ matrix.platform }}'.StartsWith('macos-')
          $isReleaseTag = $env:GITHUB_REF -like 'refs/tags/v*'
          $hasImportedDeveloperId = $isMacPlatform -and $isReleaseTag -and -not [string]::IsNullOrWhiteSpace($env:MACOS_CERTIFICATE)
          if ($isMacPlatform -and -not $hasImportedDeveloperId) {
            Write-Host '使用 electron-builder 对完整 macOS 应用执行 ad-hoc 签名。'
            $env:CSC_FOR_PULL_REQUEST = 'true'
            $buildArguments += '--config.mac.identity=-'
            $buildArguments += '--config.mac.hardenedRuntime=false'
          }

          pnpm run dist -- @buildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ('${{ matrix.platform }}' -eq 'macos-arm64') {
            Move-Item -LiteralPath 'release/latest-mac.yml' -Destination 'release/latest-arm64-mac.yml'
          }
          if ('${{ matrix.platform }}' -eq 'macos-x64') {
            Move-Item -LiteralPath 'release/latest-mac.yml' -Destination 'release/latest-x64-mac.yml'
          }

      - name: 冒烟检查 Windows 打包应用
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          .\scripts\smoke-package.ps1 -ApplicationPath 'release\win-unpacked\DSH Codex Desktop.exe'

      - name: 冒烟检查 macOS 打包应用
        if: startsWith(matrix.platform, 'macos-')
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $applicationPath = Get-ChildItem -LiteralPath 'release' -Recurse -Directory -Filter '*.app' | Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($applicationPath)) { throw '未找到 macOS 应用包。' }
          & /usr/bin/codesign --verify --deep --strict --verbose=2 $applicationPath
          if ($LASTEXITCODE -ne 0) { throw 'macOS 应用签名验证失败。' }
          & /usr/bin/codesign --display --verbose=4 $applicationPath
          pnpm run smoke:mac -- --application-path $applicationPath

      - name: 冒烟检查 Linux 打包应用
        if: matrix.platform == 'linux-x64'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $applicationPath = Join-Path $env:GITHUB_WORKSPACE 'release/linux-unpacked/dsh-codex-desktop'
          if (-not (Test-Path -LiteralPath $applicationPath -PathType Leaf)) { throw '未找到 Linux 应用可执行文件。' }
          & xvfb-run -a pnpm run smoke:linux -- --application-path $applicationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传平台制品
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release/**
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    steps:
      - name: 检出发布元数据
        uses: actions/checkout@v4

      - name: 配置 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 下载各平台制品
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $files = Get-ChildItem -LiteralPath 'release' -File | Where-Object { $_.Extension -in '.exe', '.zip', '.dmg', '.AppImage', '.deb', '.yml', '.blockmap' }
          if ($files.Count -eq 0) { throw '未找到可发布的安装包。' }
          node scripts/extract-release-notes.mjs $env:GITHUB_REF_NAME release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $env:GITHUB_REF_NAME @($files.FullName) --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @($files.FullName) --title $env:GITHUB_REF_NAME --notes-file release-notes.md
          }
