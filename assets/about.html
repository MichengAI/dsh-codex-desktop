<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>关于 DSH Codex Desktop</title>
  <script>document.documentElement.dataset.colorScheme=new URLSearchParams(location.search).get('theme')==='light'?'light':'dark'</script>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei UI",sans-serif;background:#202322;color:#eef0ef}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#202322}body{border:1px solid #343836}
    .titlebar{-webkit-app-region:drag;height:36px;display:flex;align-items:center;padding-left:12px;border-bottom:1px solid #303432;color:#c8cdca;font-size:12px;user-select:none}.titlebar-title{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.titlebar-close{-webkit-app-region:no-drag;margin-left:auto;width:46px;height:35px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}.titlebar-close:hover{background:#c42b1c}.titlebar-close img{width:13px;height:13px;filter:invert(90%)}
    main{max-width:496px;margin:0 auto;padding:20px 0 24px}
    .hero{display:flex;gap:20px;align-items:center;margin-bottom:20px}.icon{width:76px;height:76px;border-radius:18px;box-shadow:0 8px 24px #0007}
    h1{font-size:24px;line-height:1.25;margin:0 0 7px;letter-spacing:-.02em}.tagline{margin:0;color:#aeb4b1;font-size:14px;line-height:1.55}
    .card{background:#292c2b;border:1px solid #3a3e3c;border-radius:14px;padding:16px 20px;margin-top:12px}
    .meta{display:grid;grid-template-columns:1fr auto;gap:12px 20px;font-size:13px}.meta dt{color:#aeb4b1}.meta dd{margin:0;color:#f3f5f4;font-variant-numeric:tabular-nums}
    h2{font-size:14px;margin:0 0 10px;color:#f3f5f4}.copy{font-size:13px;color:#c8cdca;line-height:1.7;margin:0}
    ul{margin:12px 0 0;padding-left:19px;color:#c8cdca;font-size:13px;line-height:1.7}
    .actions{display:flex;gap:10px;margin-top:16px}.actions button{height:38px;border-radius:9px;padding:0 16px;font:inherit;font-size:13px;color:#eef0ef;border:1px solid #464b48;background:#303432;cursor:pointer}.actions button.primary{background:#e7eae8;color:#171918;border-color:#e7eae8;font-weight:600}.actions button:hover{filter:brightness(1.08)}
    footer{margin-top:16px;padding-top:14px;border-top:1px solid #353937;color:#898f8c;font-size:12px;line-height:1.55}
    :root[data-color-scheme="light"]{color-scheme:light;background:#fff;color:#0f1115}
    :root[data-color-scheme="light"] body{border-color:#0000001a;background:#fff}
    :root[data-color-scheme="light"] .titlebar{border-bottom-color:#0000001a;color:#61666b;background:#f9fafb}
    :root[data-color-scheme="light"] .titlebar-close img{filter:brightness(0);opacity:.72}
    :root[data-color-scheme="light"] .titlebar-close:hover img{filter:brightness(0) invert(1);opacity:1}
    :root[data-color-scheme="light"] .icon{box-shadow:0 8px 24px #0003}
    :root[data-color-scheme="light"] .tagline,:root[data-color-scheme="light"] .meta dt{color:#61666b}
    :root[data-color-scheme="light"] .card{border-color:#0000001a;background:#f9fafb}
    :root[data-color-scheme="light"] .meta dd,:root[data-color-scheme="light"] h2{color:#0f1115}
    :root[data-color-scheme="light"] .copy,:root[data-color-scheme="light"] ul{color:#43454a}
    :root[data-color-scheme="light"] .actions button{border-color:#00000029;background:#fff;color:#0f1115}
    :root[data-color-scheme="light"] .actions button.primary{border-color:#0f1115;background:#0f1115;color:#fff}
    :root[data-color-scheme="light"] footer{border-top-color:#0000001a;color:#81858c}
  </style>
</head>
<body>
  <header class="titlebar">
    <span id="windowTitle" class="titlebar-title">关于 DSH Codex Desktop</span>
    <button id="close" class="titlebar-close" type="button" aria-label="关闭"><img src="shell-icons/xmark.svg" alt=""></button>
  </header>
  <main>
    <section class="hero">
      <img class="icon" src="icon.png" alt="DSH Codex Desktop">
      <div><h1>DSH Codex Desktop</h1><p id="tagline" class="tagline">面向 DeepSeek Harness 的跨平台桌面客户端</p></div>
    </section>
    <dl class="card meta">
      <dt id="desktopLabel">桌面版本</dt><dd id="desktopVersion">—</dd>
      <dt id="runtimeLabel">DSH 运行时</dt><dd id="runtimeVersion">—</dd>
      <dt id="platformLabel">运行平台</dt><dd id="platform">—</dd>
    </dl>
    <section class="card">
      <h2 id="aboutTitle">关于这个项目</h2>
      <p id="aboutCopy" class="copy">把本地项目、会话、插件、自动化与智能体工作流集中在一个原生桌面窗口中，同时保留 DeepSeek Harness 的开放插件能力。</p>
      <ul id="features"><li>按项目管理聊天和工作区</li><li>原生菜单、托盘、快捷键与安全重载</li><li>由 MichengAI 维护的开源桌面应用</li></ul>
    </section>
    <div class="actions">
      <button id="releases" class="primary" type="button">查看新功能</button>
      <button id="feedback" type="button">问题反馈</button>
    </div>
    <footer id="footer">Apache-2.0 开源许可 · DSH Codex Desktop 不存储你的模型凭据。</footer>
  </main>
  <script>
    const api=window.dshShell;
    function pickLocale(loc, map){const norm=(loc||'').toLowerCase().split('-')[0];return map[norm]||(norm.startsWith('zh')?map.zh:map.en)}
    function applyBootstrap(value){
      const loc=value.locale;
      document.documentElement.lang=value.locale;
      document.documentElement.dataset.colorScheme=value.colorScheme;
      document.documentElement.style.colorScheme=value.colorScheme;
      document.title=pickLocale(loc,{zh:'关于 DSH Codex Desktop',en:'About DSH Codex Desktop',ja:'DSH Codex Desktop について',es:'Acerca de DSH Codex Desktop',fr:'À propos de DSH Codex Desktop',de:'Über DSH Codex Desktop',ru:'О программе DSH Codex Desktop',pt:'Sobre o DSH Codex Desktop'});
      document.getElementById('windowTitle').textContent=document.title;
      document.getElementById('close').setAttribute('aria-label',pickLocale(loc,{zh:'关闭',en:'Close',ja:'閉じる',es:'Cerrar',fr:'Fermer',de:'Schließen',ru:'Закрыть',pt:'Fechar'}));
      document.getElementById('desktopVersion').textContent=`v${value.version}`;
      document.getElementById('runtimeVersion').textContent=value.runtimeVersion;
      document.getElementById('platform').textContent=value.platform;
      document.getElementById('tagline').textContent=pickLocale(loc,{zh:'面向 DeepSeek Harness 的跨平台桌面客户端',en:'A cross-platform desktop client for DeepSeek Harness',ja:'DeepSeek Harness 向けクロスプラットフォームデスクトップクライアント',es:'Cliente de escritorio multiplataforma para DeepSeek Harness',fr:'Client de bureau multiplateforme pour DeepSeek Harness',de:'Plattformübergreifender Desktop-Client für DeepSeek Harness',ru:'Кроссплатформенный десктопный клиент для DeepSeek Harness',pt:'Cliente desktop multiplataforma para DeepSeek Harness'});
      document.getElementById('desktopLabel').textContent=pickLocale(loc,{zh:'桌面版本',en:'Desktop version',ja:'デスクトップ版',es:'Versión de escritorio',fr:'Version bureau',de:'Desktop-Version',ru:'Версия приложения',pt:'Versão desktop'});
      document.getElementById('runtimeLabel').textContent=pickLocale(loc,{zh:'DSH 运行时',en:'DSH runtime',ja:'DSH ランタイム',es:'Entorno de ejecución DSH',fr:'Exécutable DSH',de:'DSH-Laufzeitumgebung',ru:'Среда выполнения DSH',pt:'Runtime do DSH'});
      document.getElementById('platformLabel').textContent=pickLocale(loc,{zh:'运行平台',en:'Platform',ja:'プラットフォーム',es:'Plataforma',fr:'Plateforme',de:'Plattform',ru:'Платформа',pt:'Plataforma'});
      document.getElementById('aboutTitle').textContent=pickLocale(loc,{zh:'关于这个项目',en:'About this project',ja:'このプロジェクトについて',es:'Acerca de este proyecto',fr:'À propos de ce projet',de:'Über dieses Projekt',ru:'Об этом проекте',pt:'Sobre este projeto'});
      document.getElementById('aboutCopy').textContent=pickLocale(loc,{zh:'把本地项目、会话、插件、自动化与智能体工作流集中在一个原生桌面窗口中，同时保留 DeepSeek Harness 的开放插件能力。',en:'Bring local projects, chats, plugins, automations, and agent workflows into one native desktop window while preserving the open DeepSeek Harness plugin model.',ja:'ローカルプロジェクト、チャット、プラグイン、自動化、Agent ワークフローをネイティブなデスクトップウィンドウに統合し、DeepSeek Harness のオープンなプラグインエコシステムを維持します。',es:'Reúne proyectos locales, chats, complementos, automatizaciones y flujos de trabajo de agentes en una ventana nativa mientras mantiene el ecosistema abierto de DeepSeek Harness.',fr:"Rassemblez projets locaux, discussions, extensions, automatisations et flux d'agents dans une fenêtre native tout en conservant l'écosystème ouvert de DeepSeek Harness.",de:'Bündelt lokale Projekte, Chats, Plugins, Automatisierungen und Agenten-Workflows in einem nativen Fenster und behält das offene Plugin-Modell von DeepSeek Harness bei.',ru:'Объединяйте локальные проекты, чаты, плагины, автоматизацию и рабочие процессы агентов в одном окне, сохраняя открытую экосистему плагинов DeepSeek Harness.',pt:'Reúna projetos locais, conversas, extensões, automações e fluxos de trabalho de agentes em uma janela nativa, preservando o ecossistema aberto do DeepSeek Harness.'});
      document.getElementById('features').innerHTML=pickLocale(loc,{zh:'<li>按项目管理聊天和工作区</li><li>原生菜单、托盘、快捷键与安全重载</li><li>由 MichengAI 维护的开源桌面应用</li>',en:'<li>Project-based chats and workspaces</li><li>Native menus, tray, shortcuts, and safe reload</li><li>Open-source desktop app maintained by MichengAI</li>',ja:'<li>プロジェクトごとのチャットとワークスペース管理</li><li>ネイティブメニュー、トレイ、ショートカット、安全な再読み込み</li><li>MichengAI がメンテナンスするオープンソースアプリ</li>',es:'<li>Chats y espacios de trabajo por proyecto</li><li>Menús nativos, bandeja, atajos y recarga segura</li><li>Aplicación de código abierto mantenida por MichengAI</li>',fr:"<li>Discussions et espaces de travail par projet</li><li>Menus natifs, barre d'état, raccourcis et rechargement sécurisé</li><li>Application open-source maintenue par MichengAI</li>",de:'<li>Projektbasierte Chats und Arbeitsbereiche</li><li>Native Menüs, Tray, Kurzbefehle und sicheres Neuladen</li><li>Open-Source-Desktop-App, gepflegt von MichengAI</li>',ru:'<li>Чаты и рабочие области по проектам</li><li>Нативное меню, трей, горячие клавиши и безопасная перезагрузка</li><li>Приложение с открытым исходным кодом от MichengAI</li>',pt:'<li>Conversas e espaços de trabalho por projeto</li><li>Menus nativos, bandeja, atalhos e recarregamento seguro</li><li>Aplicativo de código aberto mantido por MichengAI</li>'});
      document.getElementById('releases').textContent=pickLocale(loc,{zh:'查看新功能',en:"What's new",ja:'最新情報',es:'Novedades',fr:'Nouveautés',de:'Neuigkeiten',ru:'Что нового',pt:'Novidades'});
      document.getElementById('feedback').textContent=pickLocale(loc,{zh:'问题反馈',en:'Send feedback',ja:'フィードバック',es:'Comentarios',fr:'Commentaires',de:'Feedback',ru:'Обратная связь',pt:'Feedback'});
      document.getElementById('footer').textContent=pickLocale(loc,{zh:'Apache-2.0 开源许可 · DSH Codex Desktop 不存储你的模型凭据。',en:'Apache-2.0 licensed · DSH Codex Desktop does not store your model credentials.',ja:'Apache-2.0 ライセンス · DSH Codex Desktop はモデルの資格情報を保存しません。',es:'Licencia Apache-2.0 · DSH Codex Desktop no almacena sus credenciales de modelo.',fr:'Licence Apache-2.0 · DSH Codex Desktop ne stocke pas vos identifiants de modèle.',de:'Apache-2.0-Lizenz · DSH Codex Desktop speichert Ihre Modell-Zugangsdaten nicht.',ru:'Лицензия Apache-2.0 · DSH Codex Desktop не сохраняет ваши учетные данные моделей.',pt:'Licença Apache-2.0 · O DSH Codex Desktop não armazena suas credenciais de modelo.'});
    }
    api.getBootstrap().then(applyBootstrap);api.onBootstrap(applyBootstrap);
    document.getElementById('close').addEventListener('click',()=>window.close());
    document.getElementById('releases').addEventListener('click',()=>api.action('whats-new'));
    document.getElementById('feedback').addEventListener('click',()=>api.action('feedback'));
  </script>
</body>
</html>
