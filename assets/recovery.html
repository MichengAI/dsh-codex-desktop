<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DSH Codex Desktop 恢复</title>
  <style>
    :root{color-scheme:light dark;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;--canvas:#f5f6f8;--surface:#ffffff;--surface-subtle:#f8f9fa;--line:#d9dde3;--text:#20242a;--text-muted:#5f6873;--primary:#0866c6;--primary-hover:#0756a6;--primary-text:#ffffff;--danger:#b42318;--danger-fill:#b42318;--danger-surface:#fff2f0;--danger-line:#f0b9b2;--focus:#0756a6;--dialog-backdrop:rgba(24,28,33,.3);--shadow:0 14px 38px rgba(24,28,33,.12)}
    :root[data-color-scheme="dark"]{--canvas:#1b1d20;--surface:#24272b;--surface-subtle:#1f2226;--line:#41464d;--text:#f2f4f6;--text-muted:#b2bac4;--primary:#69b3ff;--primary-hover:#8ac4ff;--primary-text:#10253b;--danger:#ffb4aa;--danger-fill:#ba1a1a;--danger-surface:#3a2424;--danger-line:#8b514b;--focus:#a5d0ff;--dialog-backdrop:rgba(0,0,0,.56);--shadow:0 14px 38px rgba(0,0,0,.32)}
    *{box-sizing:border-box}html,body{min-width:0;min-height:100%;margin:0}body{min-height:100vh;background:var(--canvas);color:var(--text)}button{min-height:40px;padding:0 14px;border:1px solid transparent;border-radius:4px;background:transparent;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation;transition:background-color 140ms ease,border-color 140ms ease,opacity 140ms ease}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button:disabled{cursor:wait;opacity:.62}
    main{width:min(820px,calc(100% - 48px));margin:0 auto;padding:28px 0 24px}.page-header{padding-bottom:20px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:26px;line-height:1.3;font-weight:600}p{max-width:680px;margin:8px 0 0;color:var(--text-muted);font-size:15px;line-height:1.55}.summary{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-size:14px;font-weight:600}.status{display:inline-flex;align-items:center;min-height:24px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface-subtle);color:var(--text-muted);font-size:12px;font-weight:600}.status.active{border-color:var(--primary);color:var(--primary)}
    .section{padding:18px 0;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section-heading{margin:0;font-size:16px;line-height:1.4;font-weight:600}.error-box{max-height:120px;overflow:auto;margin:10px 0 0;padding:10px 12px;border:1px solid var(--danger-line);border-radius:4px;background:var(--danger-surface);color:var(--text);font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.startup-log{max-height:280px;margin-top:10px;border-color:var(--line);background:var(--surface-subtle)}.section-note{margin-top:6px;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.primary{min-width:156px;background:var(--primary);color:var(--primary-text);font-weight:600}.primary:hover:not(:disabled){background:var(--primary-hover)}.secondary{border-color:var(--line);background:var(--surface);color:var(--text)}.secondary:hover:not(:disabled){background:var(--surface-subtle)}.notice{min-height:18px;margin-top:8px;font-size:14px}.notice[role="alert"]{color:var(--danger);font-weight:500}
    .plugin-list{margin-top:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden}.plugin-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.plugin-row:last-child{border-bottom:0}.plugin-row.suspected{background:var(--danger-surface)}.plugin-name{min-width:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}.plugin-meta{margin-top:3px;color:var(--text-muted);font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}.suspected-note{margin-top:4px;color:var(--danger);font-size:13px;font-weight:600}.row-actions{display:flex;gap:8px}.row-actions button{min-height:36px;padding:0 10px;font-size:13px}.restore{border-color:var(--primary);color:var(--primary)}.restore:hover:not(:disabled){background:var(--surface-subtle)}.remove{border-color:var(--danger-line);color:var(--danger)}.remove:hover:not(:disabled){background:var(--danger-surface)}.empty{padding:13px 12px;color:var(--text-muted);font-size:14px}
    dialog{width:min(460px,calc(100% - 32px));padding:24px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:var(--dialog-backdrop)}dialog h2{margin:0;font-size:19px;line-height:1.4}dialog p{margin-top:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.dialog-actions button{min-height:32px;padding:0 10px;font-size:13px}.dialog-actions .primary{min-width:0}.danger{background:var(--danger-fill);color:#fff;font-weight:600}.danger:hover:not(:disabled){opacity:.88}
    @media (max-width:600px){main{width:calc(100% - 32px);padding-top:36px}.plugin-row{grid-template-columns:1fr}.row-actions{justify-content:flex-start}.actions button{flex:1;min-width:0}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main id="main-content" tabindex="-1">
    <header class="page-header">
      <h1>DSH Codex Desktop 恢复</h1>
      <p>DSH 未能完成加载。下方列出与本次加载失败相关的可疑插件。</p>
      <div class="summary"><span>当前配置：web</span><span class="status" id="status">正在检查</span></div>
    </header>

    <section class="section" id="startup-error-section" aria-labelledby="error-heading">
      <h2 class="section-heading" id="error-heading">启动错误</h2>
      <pre class="error-box" id="failure-message" role="alert">正在读取启动错误。</pre>
      <pre class="error-box startup-log" id="startup-log" hidden>正在读取启动日志。</pre>
    </section>

    <section class="section" aria-labelledby="recovery-heading">
      <h2 class="section-heading" id="recovery-heading">恢复操作</h2>
      <p class="section-note" id="recovery-description">正在读取恢复状态。</p>
      <div class="actions">
        <button class="primary" id="primary-action">启动恢复模式</button>
        <button class="secondary" id="show-log">显示完整启动日志</button>
        <button class="secondary" id="restore-healthy-config" hidden>恢复最近正常配置</button>
      </div>
      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </section>

    <section class="section" aria-labelledby="plugins-heading">
      <h2 class="section-heading" id="plugins-heading">可能影响加载的插件</h2>
      <p class="section-note" id="plugins-description">正在读取本次加载失败的诊断结果。</p>
      <div class="plugin-list" id="plugin-list"></div>
    </section>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title">卸载此插件？</h2>
    <p id="confirm-message"></p>
    <div class="dialog-actions"><button class="secondary" id="cancel-uninstall">取消</button><button class="danger" id="confirm-uninstall">确认卸载</button></div>
  </dialog>
  <dialog id="confirm-healthy-dialog" aria-labelledby="confirm-healthy-title">
    <h2 id="confirm-healthy-title">恢复最近正常配置？</h2>
    <p>这会覆盖当前 Profile 的插件清单和组合配置，不会删除会话、项目或插件文件。</p>
    <div class="dialog-actions"><button class="secondary" id="cancel-healthy-restore">取消</button><button class="primary" id="confirm-healthy-restore">确认恢复</button></div>
  </dialog>

  <script>
    const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
    const applyColorScheme = () => { document.documentElement.dataset.colorScheme = colorScheme.matches ? 'dark' : 'light'; };
    applyColorScheme();
    colorScheme.addEventListener('change', applyColorScheme);

    const loc = new URLSearchParams(location.search).get('locale') || new URLSearchParams(location.search).get('lang') || navigator.language;
    const norm = (loc || '').toLowerCase().split('-')[0];
    function t(map) { return map[norm] || (norm.startsWith('zh') ? map.zh : map.en); }
    document.documentElement.lang = loc;

    document.title = t({ zh: 'DSH Codex Desktop 恢复', en: 'DSH Codex Desktop Recovery', ja: 'DSH Codex Desktop 復元', es: 'Recuperación de DSH Codex Desktop', fr: 'Récupération de DSH Codex Desktop', de: 'DSH Codex Desktop Wiederherstellung', ru: 'Восстановление DSH Codex Desktop', pt: 'Recuperação do DSH Codex Desktop' });
    document.querySelector('h1').textContent = document.title;
    document.querySelector('.page-header p').textContent = t({ zh: 'DSH 未能完成加载。下方列出与本次加载失败相关的可疑插件。', en: 'DSH failed to complete loading. Suspected plugins related to this failure are listed below.', ja: 'DSH の読み込みに失敗しました。以下に問題と思われるプラグインを一覧表示します。', es: 'DSH no pudo completar la carga. A continuación se listan los complementos sospechosos.', fr: "DSH n'a pas pu terminer son chargement. Les extensions suspectes sont listées ci-dessous.", de: 'DSH konnte nicht vollständig geladen werden. Nachfolgend sind verdächtige Plugins aufgeführt.', ru: 'DSH не удалось загрузить. Ниже перечислены подозрительные плагины.', pt: 'O DSH não concluiu o carregamento. Os plugins suspeitos estão listados abaixo.' });
    document.getElementById('error-heading').textContent = t({ zh: '启动错误', en: 'Startup Error', ja: '起動エラー', es: 'Error de inicio', fr: 'Erreur de démarrage', de: 'Startfehler', ru: 'Ошибка запуска', pt: 'Erro de inicialização' });
    document.getElementById('recovery-heading').textContent = t({ zh: '恢复操作', en: 'Recovery Actions', ja: '復元操作', es: 'Acciones de recuperación', fr: 'Actions de récupération', de: 'Wiederherstellungsaktionen', ru: 'Действия по восстановлению', pt: 'Ações de recuperação' });
    document.getElementById('plugins-heading').textContent = t({ zh: '可能影响加载的插件', en: 'Plugins That May Affect Loading', ja: '読み込みに影響する可能性のあるプラグイン', es: 'Complementos que pueden afectar la carga', fr: 'Extensions pouvant affecter le chargement', de: 'Plugins, die das Laden beeinträchtigen können', ru: 'Плагины, влияющие на загрузку', pt: 'Plugins que podem afetar o carregamento' });
    document.getElementById('confirm-title').textContent = t({ zh: '卸载此插件？', en: 'Uninstall this plugin?', ja: 'このプラグインをアンインストールしますか？', es: '¿Desinstalar este complemento?', fr: 'Désinstaller cette extension ?', de: 'Dieses Plugin deinstallieren?', ru: 'Удалить этот плагин?', pt: 'Desinstalar este plugin?' });
    document.getElementById('confirm-healthy-title').textContent = t({ zh: '恢复最近正常配置？', en: 'Restore last known good configuration?', ja: '前回の正常な設定に戻しますか？', es: '¿Restaurar la última configuración válida?', fr: 'Restaurer la dernière configuration fonctionnelle ?', de: 'Letzte funktionierende Konfiguration wiederherstellen?', ru: 'Восстановить последнюю рабочую конфигурацию?', pt: 'Restaurar última configuração válida?' });
    document.getElementById('cancel-uninstall').textContent = t({ zh: '取消', en: 'Cancel', ja: 'キャンセル', es: 'Cancelar', fr: 'Annuler', de: 'Abbrechen', ru: 'Отмена', pt: 'Cancelar' });
    document.getElementById('cancel-healthy-restore').textContent = t({ zh: '取消', en: 'Cancel', ja: 'キャンセル', es: 'Cancelar', fr: 'Annuler', de: 'Abbrechen', ru: 'Отмена', pt: 'Cancelar' });
    document.getElementById('confirm-uninstall').textContent = t({ zh: '确认卸载', en: 'Confirm Uninstall', ja: 'アンインストールを実行', es: 'Confirmar desinstalación', fr: 'Confirmer la désinstallation', de: 'Deinstallation bestätigen', ru: 'Подтвердить удаление', pt: 'Confirmar desinstalação' });
    document.getElementById('confirm-healthy-restore').textContent = t({ zh: '确认恢复', en: 'Confirm Restore', ja: '復元を実行', es: 'Confirmar restauración', fr: 'Confirmer la restauration', de: 'Wiederherstellung bestätigen', ru: 'Подтвердить восстановление', pt: 'Confirmar restauração' });
    document.getElementById('show-log').textContent = t({ zh: '显示完整启动日志', en: 'Show Full Startup Log', ja: '完全な起動ログを表示', es: 'Mostrar registro completo', fr: 'Afficher le journal complet', de: 'Vollständiges Startprotokoll anzeigen', ru: 'Показать полный журнал', pt: 'Exibir log completo' });
    document.getElementById('restore-healthy-config').textContent = t({ zh: '恢复最近正常配置', en: 'Restore Last Good Config', ja: '前回の正常な設定に戻す', es: 'Restaurar configuración válida', fr: 'Restaurer dernière bonne configuration', de: 'Letzte gute Konfig. wiederherstellen', ru: 'Восстановить рабочую конфигурацию', pt: 'Restaurar última boa configuração' });

    const api = window.dshRecovery;
    const main = document.getElementById('main-content');
    const status = document.getElementById('status');
    const startupErrorSection = document.getElementById('startup-error-section');
    const failureMessage = document.getElementById('failure-message');
    const recoveryDescription = document.getElementById('recovery-description');
    const primaryAction = document.getElementById('primary-action');
    const showLog = document.getElementById('show-log');
    const restoreHealthyConfigButton = document.getElementById('restore-healthy-config');
    const startupLog = document.getElementById('startup-log');
    const pluginsDescription = document.getElementById('plugins-description');
    const pluginList = document.getElementById('plugin-list');
    const notice = document.getElementById('notice');
    const dialog = document.getElementById('confirm-dialog');
    const confirmMessage = document.getElementById('confirm-message');
    const cancelUninstall = document.getElementById('cancel-uninstall');
    const confirmUninstall = document.getElementById('confirm-uninstall');
    const healthyDialog = document.getElementById('confirm-healthy-dialog');
    const cancelHealthyRestore = document.getElementById('cancel-healthy-restore');
    const confirmHealthyRestore = document.getElementById('confirm-healthy-restore');
    let currentState;
    let uninstallTarget;
    let startupLogVisible = false;

    const escapeHtml = value => String(value ?? '').replace(/[&<'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    const setNotice = (message, error = false) => { notice.textContent = message; notice.setAttribute('role', error ? 'alert' : 'status'); };
    const setButtonLoading = (button, loadingText) => { const label = button.textContent; button.disabled = true; button.setAttribute('aria-busy', 'true'); button.textContent = loadingText; return label; };
    const resetButton = (button, label) => { button.disabled = false; button.removeAttribute('aria-busy'); button.textContent = label; };

    async function refresh() {
      try {
        currentState = await api.getStatus();
        render(currentState);
      } catch (error) {
        failureMessage.textContent = '无法读取恢复状态。请重新启动应用后再试。';
        setNotice('无法读取恢复状态。', true);
      }
    }

    function pluginRows(plugins, suspectedPlugin, isolated = true) {
      if (plugins.length === 0) return `<div class="empty">${t({ zh: '未定位到需要隔离的插件。', en: 'No plugins found that require isolation.', ja: '隔離が必要なプラグインは見つかりませんでした。', es: 'No se encontraron complementos que requieran aislamiento.', fr: "Aucune extension nécessitant un isolement n'a été trouvée.", de: 'Keine Plugins gefunden, die isoliert werden müssen.', ru: 'Не найдено плагинов, требующих изоляции.', pt: 'Nenhum plugin requer isolamento.' })}</div>`;
      return plugins.map(plugin => {
        const suspected = plugin.packageName === suspectedPlugin;
        const name = escapeHtml(plugin.packageName);
        if (!isolated) return `<article class="plugin-row"><div><div class="plugin-name">${name}</div><div class="plugin-meta">${t({ zh: '可能影响本次加载，尚未隔离', en: 'May affect this load, not isolated yet', ja: '今回の読み込みに影響する可能性があります（未隔離）', es: 'Puede afectar la carga actual, aún no aislado', fr: 'Peut affecter ce chargement, non isolé pour le moment', de: 'Kann diesen Ladevorgang beeinträchtigen, noch nicht isoliert', ru: 'Может влиять на загрузку, еще не изолирован', pt: 'Pode afetar este carregamento, ainda não isolado' })}</div></div></article>`;
        const isolatedMeta = t({ zh: '已隔离，未加载', en: 'Isolated, not loaded', ja: '隔離済み、未読み込み', es: 'Aislado, no cargado', fr: 'Isolé, non chargé', de: 'Isoliert, nicht geladen', ru: 'Изолирован, не загружен', pt: 'Isolado, não carregado' });
        const suspectedNote = t({ zh: '检测到可能导致启动失败的插件，建议卸载。', en: 'Suspected plugin causing startup failure detected. Recommended to uninstall.', ja: '起動失敗の原因と思われるプラグインが検出されました。アンインストールを推奨します。', es: 'Se detectó un complemento sospechoso de causar el fallo. Se recomienda desinstalar.', fr: 'Extension suspectée d\'avoir causé l\'échec détectée. Désinstallation recommandée.', de: 'Verdächtiges Plugin erkannt, das den Startfehler verursacht. Deinstallation empfohlen.', ru: 'Обнаружен плагин, вызвавший сбой запуска. Рекомендуется удалить.', pt: 'Plugin suspeito de causar falha detectado. Recomenda-se desinstalar.' });
        const btnUninstallThis = t({ zh: '卸载此插件', en: 'Uninstall plugin', ja: 'このプラグインを削除', es: 'Desinstalar complemento', fr: "Désinstaller l'extension", de: 'Plugin deinstallieren', ru: 'Удалить этот плагин', pt: 'Desinstalar plugin' });
        const btnRestoreAnyway = t({ zh: '仍要恢复', en: 'Restore anyway', ja: 'それでも復元', es: 'Restaurar de todos modos', fr: 'Restaurer quand même', de: 'Trotzdem wiederherstellen', ru: 'Все равно восстановить', pt: 'Restaurar mesmo assim' });
        const btnRestoreRestart = t({ zh: '恢复并重启', en: 'Restore & Restart', ja: '復元して再起動', es: 'Restaurar y reiniciar', fr: 'Restaurer et redémarrer', de: 'Wiederherstellen & Neustart', ru: 'Восстановить и перезапустить', pt: 'Restaurar e reiniciar' });
        const btnUninstall = t({ zh: '卸载', en: 'Uninstall', ja: 'アンインストール', es: 'Desinstalar', fr: 'Désinstaller', de: 'Deinstallieren', ru: 'Удалить', pt: 'Desinstalar' });
        return `<article class="plugin-row${suspected ? ' suspected' : ''}"><div><div class="plugin-name">${name}</div><div class="plugin-meta">${escapeHtml(plugin.version || t({ zh: '未知版本', en: 'unknown version', ja: '不明なバージョン', es: 'versión desconocida', fr: 'version inconnue', de: 'unbekannte Version', ru: 'неизвестная версия', pt: 'versão desconhecida' }))} · ${isolatedMeta}</div>${suspected ? `<div class="suspected-note">${suspectedNote}</div>` : ''}</div><div class="row-actions">${suspected ? `<button class="remove" data-action="uninstall" data-name="${name}">${btnUninstallThis}</button><button class="restore" data-action="restore" data-name="${name}">${btnRestoreAnyway}</button>` : `<button class="restore" data-action="restore" data-name="${name}">${btnRestoreRestart}</button><button class="remove" data-action="uninstall" data-name="${name}">${btnUninstall}</button>`}</div></article>`;
      }).join('');
    }

    function render(state) {
      primaryAction.disabled = false;
      primaryAction.removeAttribute('aria-busy');
      const canEnterWorkbench = state.active && state.running;
      const needsRetry = state.active && !state.running;
      const hasFailure = typeof state.failureMessage === 'string' && state.failureMessage.trim() !== '';
      status.textContent = canEnterWorkbench ? t({ zh: '恢复模式已就绪', en: 'Recovery ready', ja: '復元準備完了', es: 'Recuperación lista', fr: 'Récupération prête', de: 'Wiederherstellung bereit', ru: 'Готов к работе', pt: 'Recuperação pronta' })
        : needsRetry ? t({ zh: '恢复模式未就绪', en: 'Recovery not ready', ja: '復元未完了', es: 'Recuperación no lista', fr: 'Récupération non prête', de: 'Wiederherstellung nicht bereit', ru: 'Восстановление не готово', pt: 'Recuperação não pronta' })
        : t({ zh: '启动失败', en: 'Startup failed', ja: '起動失敗', es: 'Inicio fallido', fr: 'Échec du démarrage', de: 'Start fehlgeschlagen', ru: 'Сбой запуска', pt: 'Falha na inicialização' });
      status.classList.toggle('active', canEnterWorkbench);
      startupErrorSection.hidden = !hasFailure;
      showLog.hidden = !hasFailure;
      if (!hasFailure) {
        startupLog.hidden = true;
        startupLogVisible = false;
      } else {
        failureMessage.textContent = state.failureMessage;
      }
      restoreHealthyConfigButton.hidden = !state.checkpoint;
      if (canEnterWorkbench) {
        recoveryDescription.textContent = t({ zh: 'DSH 已启动，列表中的可疑插件仍处于隔离状态。', en: 'DSH has started; suspected plugins remain isolated.', ja: 'DSH は起動しましたが、一覧の問題プラグインは隔離されたままです。', es: 'DSH ha iniciado; los complementos sospechosos permanecen aislados.', fr: 'DSH a démarré ; les extensions suspectes restent isolées.', de: 'DSH wurde gestartet; verdächtige Plugins bleiben isoliert.', ru: 'DSH запущен; подозрительные плагины остаются изолированными.', pt: 'O DSH foi iniciado; os plugins suspeitos continuam isolados.' });
        primaryAction.textContent = t({ zh: '进入工作台', en: 'Open Workbench', ja: 'ワークスペースを開く', es: 'Abrir mesa de trabajo', fr: "Ouvrir l'espace de travail", de: 'Arbeitsbereich öffnen', ru: 'Открыть рабочую область', pt: 'Abrir área de trabalho' });
      } else if (needsRetry) {
        recoveryDescription.textContent = t({ zh: '列表中的可疑插件已隔离，DSH 服务尚未就绪。', en: 'Suspected plugins are isolated, but DSH is not ready yet.', ja: '問題のプラグインは隔離されましたが、DSH サービスはまだ準備できていません。', es: 'Los complementos sospechosos están aislados, pero DSH aún no está listo.', fr: 'Les extensions suspectes sont isolées, mais DSH n\'est pas encore prêt.', de: 'Verdächtige Plugins sind isoliert, DSH ist jedoch noch nicht bereit.', ru: 'Подозрительные плагины изолированы, но DSH еще не готов.', pt: 'Os plugins suspeitos estão isolados, mas o DSH ainda não está pronto.' });
        primaryAction.textContent = t({ zh: '重试恢复模式', en: 'Retry Recovery', ja: '復元を再試行', es: 'Reintentar recuperación', fr: 'Réessayer la récupération', de: 'Wiederherstellung wiederholen', ru: 'Повторить восстановление', pt: 'Tentar recuperação novamente' });
      } else {
        recoveryDescription.textContent = t({ zh: '恢复启动将仅隔离下方列出的可疑插件，保留其他插件和用户数据。', en: 'Recovery startup only isolates suspected plugins listed below, preserving other plugins and data.', ja: '復元起動では、下記の問題と思われるプラグインのみを隔離し、その他のデータは保持します。', es: 'El inicio de recuperación solo aislará los complementos sospechosos, conservando tus datos.', fr: 'Le démarrage de récupération isole uniquement les extensions suspectes ci-dessous, en préservant vos données.', de: 'Beim Wiederherstellungsstart werden nur die unten aufgeführten verdächtigen Plugins isoliert.', ru: 'При восстановлении изолируются только указанные ниже плагины, остальные данные сохраняются.', pt: 'A recuperação isolará apenas os plugins suspeitos abaixo, preservando outros dados.' });
        primaryAction.textContent = t({ zh: '启动恢复模式', en: 'Start Recovery Mode', ja: '復元モードを開始', es: 'Iniciar modo de recuperación', fr: 'Démarrer la récupération', de: 'Wiederherstellung starten', ru: 'Запустить восстановление', pt: 'Iniciar modo de recuperação' });
      }
      const isolated = state.isolated || [];
      const suspected = state.suspectedPlugin;
      pluginsDescription.textContent = state.active
        ? suspected && isolated.some(plugin => plugin.packageName === suspected)
          ? t({ zh: `已定位到可能导致本次失败的插件：${suspected}。建议卸载后再进入工作台。`, en: `Located plugin likely causing this failure: ${suspected}. Recommended to uninstall before entering the workbench.` })
          : t({ zh: `${isolated.length} 个可疑插件已隔离，当前不会加载。`, en: `${isolated.length} suspected plugins isolated; will not load.` })
        : suspected
          ? t({ zh: `检测到可能导致本次失败的插件：${suspected}。启动恢复模式后可确认卸载。`, en: `Detected plugin that may cause failure: ${suspected}. Confirm uninstall after starting recovery.` })
          : t({ zh: '尚未定位到具体插件，不会批量隔离第三方插件。', en: 'No specific plugin identified; will not isolate plugins in batch.' });
      pluginList.innerHTML = state.active ? pluginRows(isolated, suspected) : pluginRows(state.candidates || [], suspected, false);
      bindPluginActions();
    }

    function bindPluginActions() {
      pluginList.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
        const name = button.dataset.name;
        if (!name) return;
        if (button.dataset.action === 'restore') void restorePlugin(name, button);
        if (button.dataset.action === 'uninstall') {
          uninstallTarget = name;
          confirmMessage.textContent = t({ zh: `“${name}”将从当前配置中移除。卸载后需要重新安装才能恢复。`, en: `"${name}" will be removed from configuration. Reinstallation required to restore.` });
          dialog.showModal();
        }
      }));
    }

    async function startOrEnterWorkbench() {
      const label = setButtonLoading(primaryAction, currentState?.active && currentState?.running ? '正在打开工作台…' : '正在启动…');
      try {
        if (currentState?.active && currentState?.running) {
          setNotice('正在打开工作台…');
          await api.returnToWorkbench();
          return;
        }
        setNotice('正在重新启动 DSH，最长等待 120 秒。');
        await api.activate();
        await refresh();
        setNotice(currentState?.running ? 'DSH 已启动。' : 'DSH 尚未完成启动。');
      } catch (error) {
        setNotice(error instanceof Error ? error.message : '操作失败，请查看启动日志。', true);
        await refresh();
      } finally {
        if (currentState) render(currentState);
        else resetButton(primaryAction, label);
      }
    }

    async function restorePlugin(name, button) {
      const label = setButtonLoading(button, '正在恢复…');
      try {
        await api.restore(name);
        await refresh();
      } catch (error) {
        setNotice(error instanceof Error ? error.message : '恢复插件失败，请查看启动日志。', true);
        await refresh();
      } finally {
        resetButton(button, label);
      }
    }

    async function uninstallPlugin() {
      if (!uninstallTarget) return;
      const label = setButtonLoading(confirmUninstall, '正在卸载…');
      try {
        await api.uninstall(uninstallTarget);
        uninstallTarget = undefined;
        dialog.close();
        await refresh();
      } catch (error) {
        setNotice(error instanceof Error ? error.message : '卸载插件失败，请查看启动日志。', true);
      } finally {
        resetButton(confirmUninstall, label);
      }
    }

    async function restoreHealthyConfig() {
      const label = setButtonLoading(confirmHealthyRestore, '正在恢复…');
      try {
        await api.restoreHealthyConfig();
        healthyDialog.close();
        await refresh();
      } catch (error) {
        setNotice(error instanceof Error ? error.message : '恢复最近正常配置失败，请查看启动日志。', true);
      } finally {
        resetButton(confirmHealthyRestore, label);
      }
    }

    primaryAction.addEventListener('click', () => { void startOrEnterWorkbench(); });
    showLog.addEventListener('click', async () => {
      if (startupLogVisible) {
        startupLog.hidden = true;
        startupLogVisible = false;
        showLog.textContent = '显示完整启动日志';
        return;
      }
      const label = setButtonLoading(showLog, '正在读取…');
      try {
        const content = await api.getStartupLog();
        startupLog.textContent = content || '启动日志暂时为空。';
        startupLog.hidden = false;
        startupLogVisible = true;
      } catch (error) { setNotice(error instanceof Error ? error.message : '无法读取启动日志。', true); } finally { resetButton(showLog, startupLogVisible ? '隐藏完整启动日志' : label); }
    });
    cancelUninstall.addEventListener('click', () => dialog.close());
    confirmUninstall.addEventListener('click', () => { void uninstallPlugin(); });
    restoreHealthyConfigButton.addEventListener('click', () => healthyDialog.showModal());
    cancelHealthyRestore.addEventListener('click', () => healthyDialog.close());
    confirmHealthyRestore.addEventListener('click', () => { void restoreHealthyConfig(); });
    void refresh();
  </script>
</body>
</html>
