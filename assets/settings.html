<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>桌面端设置</title>
  <script>document.documentElement.dataset.colorScheme=new URLSearchParams(location.search).get('theme')==='light'?'light':'dark'</script>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei UI",sans-serif;background:#202322;color:#eef0ef}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#202322}
    body{display:grid;grid-template-columns:184px minmax(0,1fr)}
    button{font:inherit}
    aside{padding:26px 12px;border-right:1px solid #343735;background:#1c1f1e}
    .eyebrow{margin:0 10px 18px;color:#888e8b;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
    .nav-item{width:100%;height:36px;border:0;border-radius:8px;padding:0 12px;text-align:left;background:transparent;color:#a8aeab;font-size:13px;font-weight:600;cursor:pointer;outline:none;transition:background .14s,color .14s}
    .nav-item:hover{background:#292c2b;color:#eef0ef}.nav-item:focus-visible{box-shadow:inset 0 0 0 2px #a1a7a455}.nav-item[aria-current="page"]{background:#303331;color:#f0f2f1;cursor:default}
    main{overflow:auto;padding:36px 44px 48px;scrollbar-color:#505552 transparent}
    .content{max-width:560px;margin:0 auto}
    h1{margin:0 0 28px;font-size:24px;line-height:1.2;font-weight:650;letter-spacing:-.02em}
    .page[hidden]{display:none}.group{border-top:1px solid #383c3a}
    .row{min-height:78px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px;padding:17px 0;border-bottom:1px solid #343836}
    .label{display:block;margin-bottom:5px;color:#f0f2f1;font-size:14px;font-weight:540}
    .description{display:block;margin:0;max-width:390px;color:#979d9a;font-size:12.5px;line-height:1.5}
    .select-wrap{position:relative;width:198px}
    .select-trigger{width:100%;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #4a4f4c;border-radius:8px;padding:7px 10px 7px 12px;background:#2b2e2d;color:#eef0ef;font-size:12.5px;font-weight:600;line-height:1.3;text-align:left;outline:none;cursor:pointer;transition:border-color .14s,background .14s,box-shadow .14s}
    .select-trigger:hover,.select-trigger[aria-expanded="true"]{border-color:#676d6a;background:#303332}.select-trigger:focus-visible{border-color:#9ba19e;box-shadow:0 0 0 2px #9ba19e28}
    .select-trigger img{width:11px;height:11px;filter:brightness(0) invert(89%);opacity:.78;transition:transform .14s}.select-trigger[aria-expanded="true"] img{transform:rotate(180deg)}
    .select-menu{position:absolute;z-index:10;top:calc(100% + 5px);right:0;width:100%;margin:0;padding:5px;border:1px solid #4a4f4c;border-radius:9px;background:#252827;box-shadow:0 14px 34px #0008,0 2px 8px #0006}
    .select-menu[hidden]{display:none}.select-option{width:100%;min-height:34px;display:flex;align-items:center;border:0;border-radius:6px;padding:6px 9px;background:transparent;color:#dfe2e0;font-size:12.5px;line-height:1.3;text-align:left;cursor:pointer;outline:none}.select-option:hover,.select-option:focus-visible{background:#353937;color:#fff}.select-option[aria-selected="true"]{background:#3b403d;color:#fff;font-weight:650}
    .switch{position:relative;width:38px;height:22px;display:inline-block}.switch input{position:absolute;opacity:0;pointer-events:none}
    .track{position:absolute;inset:0;border-radius:999px;background:#474c49;border:1px solid #5a605d;transition:background .14s,border-color .14s}.track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#d8dbd9;box-shadow:0 1px 2px #0006;transition:transform .14s,background .14s}
    .switch input:checked+.track{background:#e7eae8;border-color:#e7eae8}.switch input:checked+.track::after{background:#202322;transform:translateX(16px)}.switch input:focus-visible+.track{box-shadow:0 0 0 2px #9ba19e55}
    .status-line{height:18px;margin-top:14px;color:#858b88;font-size:12px;text-align:right;opacity:0;transition:opacity .15s}.status-line.visible{opacity:1}
    .version-block{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid #343836}
    .version{font-size:13px;color:#cfd3d1}.badge{display:inline-flex;align-items:center;min-height:23px;border:1px solid #474c49;border-radius:999px;padding:2px 9px;color:#b9bfbc;background:#292c2b;font-size:11.5px;font-weight:600}
    .badge.available,.badge.ready{border-color:#52685d;background:#27352e;color:#bce1cc}.badge.error{border-color:#6b4c4c;background:#372929;color:#e1bcbc}
    .update-action{min-width:132px;min-height:36px;border:1px solid #555b58;border-radius:8px;padding:7px 14px;background:#e7eae8;color:#202322;font-size:12.5px;font-weight:650;cursor:pointer;outline:none;transition:background .14s,box-shadow .14s}.update-action:hover{background:#fff}.update-action:focus-visible{box-shadow:0 0 0 3px #aeb4b150}.update-action:disabled{border-color:#454946;background:#343735;color:#7e8481;cursor:default}
    .notes{margin-top:18px;padding:14px 16px;border:1px solid #363a38;border-radius:9px;background:#1d201f}.notes[hidden]{display:none}.notes-title{margin:0 0 8px;color:#cfd3d1;font-size:12px;font-weight:650}.notes-body{max-height:150px;margin:0;overflow:auto;white-space:pre-wrap;color:#969c99;font:12px/1.55 "Segoe UI",sans-serif;scrollbar-color:#505552 transparent}
    .update-feedback{min-height:20px;margin:14px 0 0;color:#979d9a;font-size:12px;line-height:1.5}.update-feedback.error{color:#e1bcbc}
    :root[data-color-scheme="light"]{color-scheme:light;background:#fff;color:#0f1115}
    :root[data-color-scheme="light"] body{background:#fff}
    :root[data-color-scheme="light"] aside{border-right-color:#0000001a;background:#f9fafb}
    :root[data-color-scheme="light"] .eyebrow,:root[data-color-scheme="light"] .status-line{color:#81858c}
    :root[data-color-scheme="light"] .nav-item{color:#61666b}
    :root[data-color-scheme="light"] .nav-item:hover{background:#2631480f;color:#0f1115}
    :root[data-color-scheme="light"] .nav-item[aria-current="page"]{background:#ebeef2;color:#0f1115}
    :root[data-color-scheme="light"] main{scrollbar-color:#d4d4d4 transparent}
    :root[data-color-scheme="light"] .group{border-top-color:#0000001a}
    :root[data-color-scheme="light"] .row,:root[data-color-scheme="light"] .version-block{border-bottom-color:#0000001a}
    :root[data-color-scheme="light"] .label,:root[data-color-scheme="light"] .version,:root[data-color-scheme="light"] .notes-title{color:#0f1115}
    :root[data-color-scheme="light"] .description,:root[data-color-scheme="light"] .update-feedback{color:#61666b}
    :root[data-color-scheme="light"] .select-trigger{border-color:#00000029;background:#fff;color:#0f1115}
    :root[data-color-scheme="light"] .select-trigger:hover,:root[data-color-scheme="light"] .select-trigger[aria-expanded="true"]{border-color:#979da6;background:#f9fafb}
    :root[data-color-scheme="light"] .select-trigger img{filter:brightness(0);opacity:.62}
    :root[data-color-scheme="light"] .select-menu{border-color:#0000001a;background:#fff;box-shadow:0 14px 34px #0000001f,0 2px 8px #00000014}
    :root[data-color-scheme="light"] .select-option{color:#43454a}
    :root[data-color-scheme="light"] .select-option:hover,:root[data-color-scheme="light"] .select-option:focus-visible{background:#f1f3f5;color:#0f1115}
    :root[data-color-scheme="light"] .select-option[aria-selected="true"]{background:#ebeef2;color:#0f1115}
    :root[data-color-scheme="light"] .track{border-color:#adb2b8;background:#e1e5ee}
    :root[data-color-scheme="light"] .track::after{background:#fff;box-shadow:0 1px 2px #0003}
    :root[data-color-scheme="light"] .switch input:checked+.track{border-color:#0f1115;background:#0f1115}
    :root[data-color-scheme="light"] .switch input:checked+.track::after{background:#fff}
    :root[data-color-scheme="light"] .badge{border-color:#0000001a;background:#f5f6f7;color:#61666b}
    :root[data-color-scheme="light"] .badge.available,:root[data-color-scheme="light"] .badge.ready{border-color:#b7dec5;background:#eefaf2;color:#24613b}
    :root[data-color-scheme="light"] .badge.error{border-color:#f2b8b8;background:#fff1f1;color:#a52b2b}
    :root[data-color-scheme="light"] .update-action{border-color:#0f1115;background:#0f1115;color:#fff}
    :root[data-color-scheme="light"] .update-action:hover{background:#353638}
    :root[data-color-scheme="light"] .update-action:disabled{border-color:#e1e5ee;background:#f1f3f5;color:#adb2b8}
    :root[data-color-scheme="light"] .notes{border-color:#0000001a;background:#f9fafb}
    :root[data-color-scheme="light"] .notes-body{color:#61666b;scrollbar-color:#d4d4d4 transparent}
    :root[data-color-scheme="light"] .update-feedback.error{color:#a52b2b}
    @media(max-width:720px){body{grid-template-columns:150px minmax(0,1fr)}main{padding:30px 28px}.row{gap:18px}.select-wrap{width:176px}}
  </style>
</head>
<body>
  <aside aria-label="设置分类">
    <p id="desktopLabel" class="eyebrow">桌面端</p>
    <button id="notificationsNav" class="nav-item" type="button" aria-current="page">通知</button>
    <button id="updatesNav" class="nav-item" type="button">更新</button>
  </aside>
  <main>
    <div class="content">
      <section id="notificationsPage" class="page" aria-labelledby="notificationsTitle">
        <h1 id="notificationsTitle">通知</h1>
        <div class="group">
          <div class="row">
            <span><span id="turnLabel" class="label">任务完成通知</span><span id="turnDescription" class="description">设置 DeepSeek Harness 完成任务时何时提醒你</span></span>
            <div class="select-wrap">
              <button id="turnModeButton" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="turnModeList">
                <span id="turnModeValue">仅在窗口未聚焦时</span><img src="./shell-icons/chevron-down.svg" alt="">
              </button>
              <div id="turnModeList" class="select-menu" role="listbox" aria-labelledby="turnLabel" hidden>
                <button class="select-option" type="button" role="option" data-value="off" aria-selected="false">从不</button>
                <button class="select-option" type="button" role="option" data-value="unfocused" aria-selected="true">仅在窗口未聚焦时</button>
                <button class="select-option" type="button" role="option" data-value="always" aria-selected="false">始终</button>
              </div>
            </div>
          </div>
          <label class="row" for="approvalsEnabled">
            <span><span id="approvalLabel" class="label">审批通知</span><span id="approvalDescription" class="description">需要你审批权限或计划时显示提醒</span></span>
            <span class="switch"><input id="approvalsEnabled" type="checkbox"><span class="track" aria-hidden="true"></span></span>
          </label>
          <label class="row" for="questionsEnabled">
            <span><span id="questionLabel" class="label">问题通知</span><span id="questionDescription" class="description">任务需要你的输入才能继续时显示提醒</span></span>
            <span class="switch"><input id="questionsEnabled" type="checkbox"><span class="track" aria-hidden="true"></span></span>
          </label>
        </div>
        <div id="notificationSaved" class="status-line" role="status" aria-live="polite">已保存</div>
      </section>

      <section id="updatesPage" class="page" aria-labelledby="updatesTitle" hidden>
        <h1 id="updatesTitle">更新</h1>
        <div class="group">
          <div class="row">
            <span><span id="policyLabel" class="label">自动更新</span><span id="policyDescription" class="description">选择桌面端如何检查和下载新版本。安装前始终由你确认。</span></span>
            <div class="select-wrap">
              <button id="policyButton" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="policyList">
                <span id="policyValue">自动检查并提醒</span><img src="./shell-icons/chevron-down.svg" alt="">
              </button>
              <div id="policyList" class="select-menu" role="listbox" aria-labelledby="policyLabel" hidden>
                <button class="select-option" type="button" role="option" data-value="notify" aria-selected="true">自动检查并提醒</button>
                <button class="select-option" type="button" role="option" data-value="auto-download" aria-selected="false">自动下载，安装前提醒</button>
                <button class="select-option" type="button" role="option" data-value="manual" aria-selected="false">仅手动检查</button>
              </div>
            </div>
          </div>
          <div class="version-block">
            <div>
              <span id="currentVersionLabel" class="label">当前版本</span>
              <span id="currentVersion" class="version">—</span>
              <span id="lastChecked" class="description">尚未检查</span>
            </div>
            <span id="updateBadge" class="badge">准备就绪</span>
          </div>
          <div class="row">
            <span><span id="checkLabel" class="label">桌面端更新</span><span id="checkDescription" class="description">检查 GitHub Releases 中适用于当前系统的新版本。</span></span>
            <button id="updateAction" class="update-action" type="button">检查更新</button>
          </div>
        </div>
        <div id="releaseNotes" class="notes" hidden>
          <p id="releaseNotesTitle" class="notes-title">版本说明</p>
          <pre id="releaseNotesBody" class="notes-body"></pre>
        </div>
        <p id="updateFeedback" class="update-feedback" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
  <script>
    const api=window.dshShell;
    const byId=id=>document.getElementById(id);
    const notificationsNav=byId('notificationsNav'),updatesNav=byId('updatesNav');
    const notificationsPage=byId('notificationsPage'),updatesPage=byId('updatesPage');
    const approvals=byId('approvalsEnabled'),questions=byId('questionsEnabled'),saved=byId('notificationSaved');
    const updateAction=byId('updateAction'),updateBadge=byId('updateBadge'),updateFeedback=byId('updateFeedback');
    const releaseNotes=byId('releaseNotes'),releaseNotesBody=byId('releaseNotesBody');
    let locale='zh-CN',currentTurnMode='unfocused',currentPolicy='notify',updateState={currentVersion:'—',packaged:false,status:{kind:'idle'}},savedTimer;

    function createListbox(buttonId,listId,valueId,initial,onCommit){
      const button=byId(buttonId),list=byId(listId),value=byId(valueId),options=[...list.querySelectorAll('[role="option"]')];
      let current=initial;
      const set=next=>{const option=options.find(item=>item.dataset.value===next)??options[0];current=option.dataset.value;value.textContent=option.textContent;for(const item of options)item.setAttribute('aria-selected',String(item===option));return current};
      const open=next=>{button.setAttribute('aria-expanded',String(next));list.hidden=!next;if(next)(options.find(item=>item.dataset.value===current)??options[0]).focus()};
      button.addEventListener('click',()=>open(list.hidden));
      button.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();open(true)}});
      list.addEventListener('keydown',event=>{const active=options.indexOf(document.activeElement);if(event.key==='Escape'){event.preventDefault();open(false);button.focus()}else if(event.key==='Tab')open(false);else if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();options[(active+(event.key==='ArrowDown'?1:-1)+options.length)%options.length].focus()}else if(event.key==='Home'||event.key==='End'){event.preventDefault();options[event.key==='Home'?0:options.length-1].focus()}});
      for(const option of options)option.addEventListener('click',()=>{set(option.dataset.value);open(false);button.focus();onCommit(current)});
      document.addEventListener('pointerdown',event=>{if(!button.parentElement.contains(event.target))open(false)});
      return {set,options};
    }

    const turnSelect=createListbox('turnModeButton','turnModeList','turnModeValue','unfocused',value=>{currentTurnMode=value;void saveNotifications()});
    const policySelect=createListbox('policyButton','policyList','policyValue','notify',value=>{currentPolicy=value;void saveUpdatePolicy()});

    function pickLocale(loc, map){const norm=(loc||'').toLowerCase().split('-')[0];return map[norm]||(norm.startsWith('zh')?map.zh:map.en)}
    function t(map){return pickLocale(locale, map)}
    function setPage(section){
      const updates=section==='updates';
      notificationsPage.hidden=updates;updatesPage.hidden=!updates;
      if(updates){updatesNav.setAttribute('aria-current','page');notificationsNav.removeAttribute('aria-current')}
      else{notificationsNav.setAttribute('aria-current','page');updatesNav.removeAttribute('aria-current')}
    }
    function localize(nextLocale){
      locale=typeof nextLocale==='string'?nextLocale:'zh-CN';document.documentElement.lang=locale;
      document.title=t({zh:'桌面端设置',en:'Desktop Settings',ja:'デスクトップ設定',es:'Configuración de escritorio',fr:'Paramètres du bureau',de:'Desktop-Einstellungen',ru:'Настройки приложения',pt:'Configurações do aplicativo'});
      document.querySelector('aside').setAttribute('aria-label',t({zh:'设置分类',en:'Settings categories',ja:'設定カテゴリ',es:'Categorías de configuración',fr:'Catégories de paramètres',de:'Einstellungskategorien',ru:'Категории настроек',pt:'Categorias de configurações'}));
      byId('desktopLabel').textContent=t({zh:'桌面端',en:'Desktop',ja:'デスクトップ',es:'Escritorio',fr:'Bureau',de:'Desktop',ru:'Приложение',pt:'Aplicativo'});
      notificationsNav.textContent=t({zh:'通知',en:'Notifications',ja:'通知',es:'Notificaciones',fr:'Notifications',de:'Benachrichtigungen',ru:'Уведомления',pt:'Notificações'});
      updatesNav.textContent=t({zh:'更新',en:'Updates',ja:'アップデート',es:'Actualizaciones',fr:'Mises à jour',de:'Updates',ru:'Обновления',pt:'Atualizações'});
      byId('notificationsTitle').textContent=t({zh:'通知',en:'Notifications',ja:'通知',es:'Notificaciones',fr:'Notifications',de:'Benachrichtigungen',ru:'Уведомления',pt:'Notificações'});
      byId('turnLabel').textContent=t({zh:'任务完成通知',en:'Task completion notifications',ja:'タスク完了通知',es:'Notificaciones de finalización de tareas',fr:'Notifications de fin de tâche',de:'Benachrichtigungen über Aufgabenabschluss',ru:'Уведомления о завершении задач',pt:'Notificações de conclusão de tarefas'});
      byId('turnDescription').textContent=t({zh:'设置 DeepSeek Harness 完成任务时何时提醒你',en:"Set when DeepSeek Harness alerts you that it's finished",ja:'DeepSeek Harness がタスクを完了したときの通知タイミングを設定します',es:'Elige cuándo te avisa DeepSeek Harness al finalizar una tarea',fr:"Choisissez quand DeepSeek Harness vous alerte lorsqu'une tâche est terminée",de:'Legen Sie fest, wann DeepSeek Harness Sie bei Fertigstellung benachrichtigt',ru:'Настройте, когда DeepSeek Harness сообщает о завершении задачи',pt:'Escolha quando o DeepSeek Harness deve avisar sobre a conclusão de tarefas'});
      const turnLabelMap={
        zh:['从不','仅在窗口未聚焦时','始终'],
        en:['Never','Only when unfocused','Always'],
        ja:['通知しない','非フォーカス時のみ','常に通知'],
        es:['Nunca','Solo desenfocado','Siempre'],
        fr:['Jamais','Uniquement si non actif','Toujours'],
        de:['Nie','Nur wenn im Hintergrund','Immer'],
        ru:['Никогда','Только не в фокусе','Всегда'],
        pt:['Nunca','Apenas em segundo plano','Sempre']
      };
      const turnLabels=pickLocale(locale, turnLabelMap);turnSelect.options.forEach((option,index)=>option.textContent=turnLabels[index]);
      byId('approvalLabel').textContent=t({zh:'审批通知',en:'Approval notifications',ja:'承認通知',es:'Notificaciones de aprobación',fr:"Notifications d'approbation",de:'Genehmigungsbenachrichtigungen',ru:'Уведомления об одобрении',pt:'Notificações de aprovação'});
      byId('approvalDescription').textContent=t({zh:'需要你审批权限或计划时显示提醒',en:'Show alerts when permissions or plans require your approval',ja:'権限や計画の承認が必要なときに通知を表示します',es:'Mostrar avisos cuando los permisos o planes requieran tu aprobación',fr:'Afficher des alertes lorsque des autorisations ou des plans nécessitent votre approbation',de:'Benachrichtigungen anzeigen, wenn Berechtigungen oder Pläne Ihre Genehmigung erfordern',ru:'Показывать оповещения, когда разрешения или планы требуют вашего одобрения',pt:'Exibir alertas quando permissões ou planos precisarem de sua aprovação'});
      byId('questionLabel').textContent=t({zh:'问题通知',en:'Question notifications',ja:'質問通知',es:'Notificaciones de preguntas',fr:'Notifications de questions',de:'Fragen-Benachrichtigungen',ru:'Уведомления о вопросах',pt:'Notificações de perguntas'});
      byId('questionDescription').textContent=t({zh:'任务需要你的输入才能继续时显示提醒',en:'Show alerts when input is needed to continue',ja:'続行するために入力が必要なときに通知を表示します',es:'Mostrar avisos cuando se necesite tu respuesta para continuar',fr:"Afficher des alertes lorsqu'une saisie est requise pour continuer",de:'Benachrichtigungen anzeigen, wenn Eingaben zum Fortfahren erforderlich sind',ru:'Показывать оповещения, когда для продолжения требуется ваш ввод',pt:'Exibir alertas quando uma resposta for necessária para continuar'});
      saved.textContent=t({zh:'已保存',en:'Saved',ja:'保存しました',es:'Guardado',fr:'Enregistré',de:'Gespeichert',ru:'Сохранено',pt:'Salvo'});
      byId('updatesTitle').textContent=t({zh:'更新',en:'Updates',ja:'アップデート',es:'Actualizaciones',fr:'Mises à jour',de:'Updates',ru:'Обновления',pt:'Atualizações'});
      byId('policyLabel').textContent=t({zh:'自动更新',en:'Automatic updates',ja:'自動アップデート',es:'Actualizaciones automáticas',fr:'Mises à jour automatiques',de:'Automatische Updates',ru:'Автоматические обновления',pt:'Atualizações automáticas'});
      byId('policyDescription').textContent=t({zh:'选择桌面端如何检查和下载新版本。安装前始终由你确认。',en:'Choose how the desktop app checks for and downloads new versions. Installation always requires your confirmation.',ja:'デスクトップアプリが新しいバージョンを確認・ダウンロードする方法を選択します。インストール前には必ず確認を求めます。',es:'Elige cómo la aplicación comprueba y descarga nuevas versiones. La instalación siempre requiere tu confirmación.',fr:"Choisissez comment l'application vérifie et télécharge les nouvelles versions. L'installation nécessite toujours votre confirmation.",de:'Wählen Sie, wie die Desktop-App nach neuen Versionen sucht und diese herunterlädt. Die Installation erfordert stets Ihre Bestätigung.',ru:'Выберите способ проверки и загрузки новых версий. Установка всегда требует вашего подтверждения.',pt:'Escolha como o aplicativo busca e baixa novas versões. A instalação sempre requer sua confirmação.'});
      const policyLabelMap={
        zh:['自动检查并提醒','自动下载，安装前提醒','仅手动检查'],
        en:['Check automatically and notify','Download automatically, ask before install','Check manually only'],
        ja:['自動確認して通知','自動ダウンロード（インストール前に確認）','手動確認のみ'],
        es:['Buscar automáticamente y notificar','Descargar automáticamente, avisar antes de instalar','Solo manual'],
        fr:['Vérifier auto et notifier','Télécharger auto, demander avant installation','Manuel uniquement'],
        de:['Automatisch prüfen und benachrichtigen','Automatisch herunterladen, vor Installation fragen','Nur manuell'],
        ru:['Автопроверка и уведомление','Автозагрузка, запрос перед установкой','Только вручную'],
        pt:['Verificar e notificar auto','Baixar auto, confirmar antes de instalar','Apenas manual']
      };
      const policyLabels=pickLocale(locale, policyLabelMap);policySelect.options.forEach((option,index)=>option.textContent=policyLabels[index]);
      byId('currentVersionLabel').textContent=t({zh:'当前版本',en:'Current version',ja:'現在のバージョン',es:'Versión actual',fr:'Version actuelle',de:'Aktuelle Version',ru:'Текущая версия',pt:'Versão atual'});
      byId('checkLabel').textContent=t({zh:'桌面端更新',en:'Desktop updates',ja:'デスクトップアップデート',es:'Actualizaciones de escritorio',fr:'Mises à jour du bureau',de:'Desktop-Updates',ru:'Обновления приложения',pt:'Atualizações do aplicativo'});
      byId('checkDescription').textContent=t({zh:'检查 GitHub Releases 中适用于当前系统的新版本。',en:'Check GitHub Releases for a new version compatible with this system.',ja:'現在のシステムと互換性のある新しいバージョンを GitHub Releases で確認します。',es:'Comprueba en GitHub Releases si hay una nueva versión compatible con este sistema.',fr:'Vérifiez sur GitHub Releases si une nouvelle version est compatible avec ce système.',de:'Überprüfen Sie GitHub Releases auf eine mit diesem System kompatible Version.',ru:'Проверка наличия новой совместимой версии в GitHub Releases.',pt:'Verifique no GitHub Releases se há uma nova versão compatível com este sistema.'});
      byId('releaseNotesTitle').textContent=t({zh:'版本说明',en:'Release notes',ja:'リリースノート',es:'Notas de la versión',fr:'Notes de version',de:'Versionshinweise',ru:'Примечания к выпуску',pt:'Notas de versão'});
      turnSelect.set(currentTurnMode);policySelect.set(currentPolicy);renderUpdateState(updateState);
    }
    function showSaved(){saved.classList.add('visible');clearTimeout(savedTimer);savedTimer=setTimeout(()=>saved.classList.remove('visible'),1200)}
    async function saveNotifications(){
      const value=await api.updateNotificationPreferences({turnMode:currentTurnMode,approvalsEnabled:approvals.checked,questionsEnabled:questions.checked});
      currentTurnMode=turnSelect.set(value.turnMode);approvals.checked=value.approvalsEnabled;questions.checked=value.questionsEnabled;showSaved();
    }
    async function saveUpdatePolicy(){
      const value=await api.updateUpdatePreferences({policy:currentPolicy});currentPolicy=policySelect.set(value.policy);
      updateFeedback.className='update-feedback';updateFeedback.textContent=t({
        zh:'更新策略已保存。',
        en:'Update policy saved.',
        ja:'更新ポリシーを保存しました。',
        es:'Política de actualización guardada.',
        fr:'Politique de mise à jour enregistrée.',
        de:'Update-Richtlinie gespeichert.',
        ru:'Политика обновлений сохранена.',
        pt:'Política de atualização salva.'
      });
    }
    function formatChecked(value){
      if(!value)return t({
        zh:'尚未检查',
        en:'Not checked yet',
        ja:'未確認',
        es:'Aún no comprobado',
        fr:'Pas encore vérifié',
        de:'Noch nicht geprüft',
        ru:'Еще не проверялось',
        pt:'Ainda não verificado'
      });
      try{
        const formatted=new Intl.DateTimeFormat(locale,{dateStyle:'medium',timeStyle:'short'}).format(new Date(value));
        return t({
          zh:'上次检查：'+formatted,
          en:'Last checked: '+formatted,
          ja:'最終確認：'+formatted,
          es:'Última comprobación: '+formatted,
          fr:'Dernière vérification : '+formatted,
          de:'Zuletzt geprüft: '+formatted,
          ru:'Последняя проверка: '+formatted,
          pt:'Última verificação: '+formatted
        });
      }catch{
        return t({
          zh:'已检查',
          en:'Checked',
          ja:'確認済み',
          es:'Comprobado',
          fr:'Vérifié',
          de:'Geprüft',
          ru:'Проверено',
          pt:'Verificado'
        });
      }
    }
    function renderUpdateState(value){
      if(!value||!value.status)return;updateState=value;const status=value.status,kind=status.kind;
      byId('currentVersion').textContent=value.currentVersion||'—';byId('lastChecked').textContent=formatChecked(value.lastCheckedAt);
      updateBadge.className='badge '+kind;updateFeedback.className='update-feedback'+(kind==='error'?' error':'');releaseNotes.hidden=true;releaseNotesBody.textContent='';
      const percent=Math.round(status.percent||0);
      const labels={
        idle:t({zh:'准备就绪',en:'Ready',ja:'準備完了',es:'Listo',fr:'Prêt',de:'Bereit',ru:'Готово',pt:'Pronto'}),
        checking:t({zh:'正在检查',en:'Checking',ja:'確認中',es:'Comprobando',fr:'Vérification',de:'Prüfen',ru:'Проверка',pt:'Verificando'}),
        available:t({zh:'有新版本',en:'Update available',ja:'更新あり',es:'Actualización disponible',fr:'Mise à jour disponible',de:'Update verfügbar',ru:'Есть обновление',pt:'Atualização disponível'}),
        none:t({zh:'已是最新',en:'Up to date',ja:'最新です',es:'Actualizado',fr:'À jour',de:'Auf dem neuesten Stand',ru:'Актуально',pt:'Atualizado'}),
        downloading:t({zh:'下载中 '+percent+'%',en:'Downloading '+percent+'%',ja:'ダウンロード中 '+percent+'%',es:'Descargando '+percent+'%',fr:'Téléchargement '+percent+'%',de:'Wird heruntergeladen '+percent+'%',ru:'Загрузка '+percent+'%',pt:'Baixando '+percent+'%'}),
        ready:t({zh:'等待安装',en:'Ready to install',ja:'インストール待機中',es:'Listo para instalar',fr:'Prêt à installer',de:'Bereit zur Installation',ru:'Готово к установке',pt:'Pronto para instalar'}),
        error:t({zh:'检查失败',en:'Check failed',ja:'確認失敗',es:'Error al comprobar',fr:'Échec de vérification',de:'Prüfung fehlgeschlagen',ru:'Ошибка проверки',pt:'Falha ao verificar'})
      };
      updateBadge.textContent=labels[kind]||labels.idle;
      let action='check',actionLabel=t({zh:'检查更新',en:'Check for updates',ja:'更新を確認',es:'Buscar actualizaciones',fr:'Vérifier les mises à jour',de:'Nach Updates suchen',ru:'Проверить обновления',pt:'Verificar atualizações'}),disabled=false,feedback='';
      if(!value.packaged){disabled=true;feedback=t({zh:'开发版本不连接发布更新服务。',en:'Development builds do not connect to the release update service.',ja:'開発版は更新配信サービスに接続しません。',es:'Las versiones de desarrollo no se conectan al servicio de actualización.',fr:'Les versions de développement ne se connectent pas au service de mise à jour.',de:'Entwicklungs-Builds sind nicht mit dem Update-Dienst verbunden.',ru:'Сборки для разработки не подключаются к службе обновлений.',pt:'Versões de desenvolvimento não se conectam ao serviço de atualização.'})}
      else if(kind==='checking'){disabled=true;feedback=t({zh:'正在检查新版本…',en:'Checking for a new version…',ja:'新しいバージョンを確認しています…',es:'Buscando una nueva versión…',fr:"Recherche d'une nouvelle version…",de:'Suche nach einer neuen Version…',ru:'Проверка новой версии…',pt:'Buscando nova versão…'})}
      else if(kind==='available'){
        if(value.installable===false){action='open-archive';actionLabel=t({zh:'下载压缩包',en:'Download zip',ja:'Zip をダウンロード',es:'Descargar zip',fr:'Télécharger le zip',de:'Zip herunterladen',ru:'Скачать zip',pt:'Baixar zip'});feedback=t({zh:'发现桌面端 '+status.version+'。当前是压缩包，不能原地安装。将打开对应 zip，请退出后替换当前文件夹。不要运行安装包。',en:'Desktop '+status.version+' is available. This zip build cannot install in place. The matching zip will open; quit and replace this folder. Do not run the installer.',ja:'デスクトップ '+status.version+' が見つかりました。この Zip 版は上書きインストールできません。新しい zip をダウンロードし、終了後にフォルダーを置き換えてください。',es:'DSH Codex Desktop '+status.version+' disponible. Descarga el nuevo zip y reemplaza la carpeta actual.',fr:'DSH Codex Desktop '+status.version+' disponible. Téléchargez le nouveau zip et remplacez ce dossier.',de:'Desktop '+status.version+' ist verfügbar. Bitte neues Zip herunterladen und Ordner ersetzen.',ru:'Доступна версия '+status.version+'. Скачайте zip и замените текущую папку.',pt:'DSH Codex Desktop '+status.version+' disponível. Baixe o novo zip e substitua a pasta atual.'})}
        else{action='download';actionLabel=t({zh:'下载 '+status.version,en:'Download '+status.version,ja:'ダウンロード '+status.version,es:'Descargar '+status.version,fr:'Télécharger '+status.version,de:'Herunterladen '+status.version,ru:'Загрузить '+status.version,pt:'Baixar '+status.version});feedback=t({zh:'发现桌面端 '+status.version+'。',en:'Desktop '+status.version+' is available.',ja:'デスクトップ '+status.version+' が見つかりました。',es:'DSH Codex Desktop '+status.version+' disponible.',fr:'DSH Codex Desktop '+status.version+' est disponible.',de:'Desktop '+status.version+' ist verfügbar.',ru:'Доступна версия '+status.version+'.',pt:'DSH Codex Desktop '+status.version+' disponível.'})}
        if(status.releaseNotes){releaseNotes.hidden=false;releaseNotesBody.textContent=status.releaseNotes}
      }
      else if(kind==='downloading'){disabled=true;feedback=t({zh:'正在下载 '+percent+'%…',en:'Downloading '+percent+'%…',ja:'ダウンロード中 '+percent+'%…',es:'Descargando '+percent+'%…',fr:'Téléchargement '+percent+'%…',de:'Wird heruntergeladen '+percent+'%…',ru:'Загрузка '+percent+'%…',pt:'Baixando '+percent+'%…'})}
      else if(kind==='ready'){action='install';actionLabel=t({zh:'安装并重启',en:'Install and restart',ja:'インストールして再起動',es:'Instalar y reiniciar',fr:'Installer et redémarrer',de:'Installieren und neu starten',ru:'Установить и перезапустить',pt:'Instalar e reiniciar'});feedback=t({zh:'桌面端 '+status.version+' 已下载。安装将关闭并重启应用，请先保存工作。',en:'Desktop '+status.version+' is downloaded. Installation closes and restarts the app, so save your work first.',ja:'デスクトップ '+status.version+' がダウンロードされました。作業内容を保存してください。',es:'DSH Codex Desktop '+status.version+' descargado. Guarda tu trabajo antes de reiniciar.',fr:'DSH Codex Desktop '+status.version+' téléchargé. Enregistrez votre travail avant de redémarrer.',de:'Desktop '+status.version+' wurde heruntergeladen. Speichern Sie Ihre Arbeit.',ru:'Версия '+status.version+' загружена. Сохраните работу перед перезапуском.',pt:'DSH Codex Desktop '+status.version+' baixado. Salve seu trabalho antes de reiniciar.'})}
      else if(kind==='none'){feedback=t({zh:'当前已是最新桌面端版本。',en:'You already have the latest desktop version.',ja:'現在最新のデスクトップ版を使用しています。',es:'Ya tienes la versión más reciente.',fr:'Vous disposez déjà de la version la plus récente.',de:'Sie verwenden bereits die neueste Version.',ru:'У вас установлена последняя версия.',pt:'Você já possui a versão mais recente.'})}
      else if(kind==='error'){feedback=status.message||t({zh:'无法检查桌面端更新，请稍后重试。',en:'Unable to check for desktop updates. Try again later.',ja:'アップデートを確認できません。後でもう一度お試しください。',es:'No se pudieron buscar actualizaciones. Inténtalo más tarde.',fr:'Impossible de vérifier les mises à jour. Réessayez plus tard.',de:'Updates konnten nicht gesucht werden. Später erneut versuchen.',ru:'Не удалось проверить обновления. Попробуйте позже.',pt:'Não foi possível verificar atualizações. Tente mais tarde.'})}
      updateAction.dataset.action=action;updateAction.textContent=actionLabel;updateAction.disabled=disabled;updateFeedback.textContent=feedback;
    }
    document.addEventListener('keydown',event=>{if(event.key!=='Escape'||document.querySelector('[role="listbox"]:not([hidden])')!==null)return;event.preventDefault();void api.closeDesktopSettings()},true);
    notificationsNav.addEventListener('click',()=>setPage('notifications'));updatesNav.addEventListener('click',()=>setPage('updates'));
    approvals.addEventListener('change',()=>void saveNotifications());questions.addEventListener('change',()=>void saveNotifications());
    updateAction.addEventListener('click',async()=>{if(updateAction.disabled)return;updateAction.disabled=true;const next=await api.desktopUpdateAction(updateAction.dataset.action||'check');if(next)renderUpdateState(next)});
    Promise.all([api.getBootstrap(),api.getNotificationPreferences(),api.getUpdatePreferences(),api.getDesktopUpdateState()]).then(([bootstrap,notifications,preferences,state])=>{
      currentTurnMode=turnSelect.set(notifications.turnMode);approvals.checked=notifications.approvalsEnabled;questions.checked=notifications.questionsEnabled;
      currentPolicy=policySelect.set(preferences.policy);applyBootstrap(bootstrap);renderUpdateState(state);
    });
    function applyBootstrap(value){document.documentElement.dataset.colorScheme=value.colorScheme;document.documentElement.style.colorScheme=value.colorScheme;localize(value.locale)}
    api.onBootstrap(applyBootstrap);api.onDesktopUpdateState(renderUpdateState);api.onSettingsSection(value=>setPage(value==='updates'?'updates':'notifications'));
  </script>
</body>
</html>
