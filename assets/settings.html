<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>桌面端设置</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei UI",sans-serif;background:#202322;color:#eef0ef}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#202322}
    body{display:grid;grid-template-columns:184px minmax(0,1fr)}
    aside{padding:26px 12px;border-right:1px solid #343735;background:#1c1f1e}
    .eyebrow{margin:0 10px 18px;color:#888e8b;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
    .nav-item{width:100%;height:36px;border:0;border-radius:8px;padding:0 12px;text-align:left;background:#303331;color:#f0f2f1;font:600 13px/1 inherit;cursor:default}
    main{overflow:auto;padding:36px 44px 48px;scrollbar-color:#505552 transparent}
    .content{max-width:560px;margin:0 auto}
    h1{margin:0 0 28px;font-size:24px;line-height:1.2;font-weight:650;letter-spacing:-.02em}
    .group{border-top:1px solid #383c3a}
    .row{min-height:78px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:28px;padding:17px 0;border-bottom:1px solid #343836}
    .label{display:block;margin-bottom:5px;color:#f0f2f1;font-size:14px;font-weight:540}
    .description{margin:0;max-width:390px;color:#979d9a;font-size:12.5px;line-height:1.5}
    .select-wrap{position:relative;width:184px}
    .select-trigger{width:100%;height:34px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #4a4f4c;border-radius:8px;padding:0 10px 0 12px;background:#2b2e2d;color:#eef0ef;font:600 12.5px/1 inherit;text-align:left;outline:none;cursor:pointer;transition:border-color .14s,background .14s,box-shadow .14s}
    .select-trigger:hover,.select-trigger[aria-expanded="true"]{border-color:#676d6a;background:#303332}.select-trigger:focus-visible{border-color:#9ba19e;box-shadow:0 0 0 2px #9ba19e28}
    .select-trigger img{width:11px;height:11px;filter:brightness(0) invert(89%);opacity:.78;transition:transform .14s}.select-trigger[aria-expanded="true"] img{transform:rotate(180deg)}
    .select-menu{position:absolute;z-index:10;top:calc(100% + 5px);right:0;width:100%;margin:0;padding:5px;border:1px solid #4a4f4c;border-radius:9px;background:#252827;box-shadow:0 14px 34px #0008,0 2px 8px #0006}
    .select-menu[hidden]{display:none}.select-option{width:100%;min-height:32px;display:flex;align-items:center;border:0;border-radius:6px;padding:0 9px;background:transparent;color:#dfe2e0;font:12.5px/1.25 inherit;text-align:left;cursor:pointer;outline:none}.select-option:hover,.select-option:focus-visible{background:#353937;color:#fff}.select-option[aria-selected="true"]{background:#3b403d;color:#fff;font-weight:650}
    .switch{position:relative;width:38px;height:22px;display:inline-block}
    .switch input{position:absolute;opacity:0;pointer-events:none}
    .track{position:absolute;inset:0;border-radius:999px;background:#474c49;border:1px solid #5a605d;transition:background .14s,border-color .14s}
    .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#d8dbd9;box-shadow:0 1px 2px #0006;transition:transform .14s,background .14s}
    .switch input:checked+.track{background:#e7eae8;border-color:#e7eae8}.switch input:checked+.track::after{background:#202322;transform:translateX(16px)}
    .switch input:focus-visible+.track{box-shadow:0 0 0 2px #9ba19e55}
    #status{height:18px;margin-top:14px;color:#858b88;font-size:12px;text-align:right;opacity:0;transition:opacity .15s}#status.visible{opacity:1}
    @media(max-width:720px){body{grid-template-columns:150px minmax(0,1fr)}main{padding:30px 28px}.row{gap:18px}.select-wrap{width:164px}}
  </style>
</head>
<body>
  <aside aria-label="设置分类">
    <p id="desktopLabel" class="eyebrow">桌面端</p>
    <button id="notificationsNav" class="nav-item" type="button" aria-current="page">通知</button>
  </aside>
  <main>
    <div class="content">
      <h1 id="title">通知</h1>
      <section aria-labelledby="title">
        <div class="group">
          <div class="row">
            <span><span id="turnLabel" class="label">任务完成通知</span><span id="turnDescription" class="description">设置 DeepSeek Harness 完成任务时何时提醒你</span></span>
            <div class="select-wrap">
              <button id="turnModeButton" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="turnModeList">
                <span id="turnModeValue">仅在窗口未聚焦时</span>
                <img src="./shell-icons/chevron-down.svg" alt="">
              </button>
              <div id="turnModeList" class="select-menu" role="listbox" aria-labelledby="turnLabel" hidden>
                <button class="select-option" type="button" role="option" data-value="off" aria-selected="false">从不</button>
                <button class="select-option" type="button" role="option" data-value="unfocused" aria-selected="true">仅在窗口未聚焦时</button>
                <button class="select-option" type="button" role="option" data-value="always" aria-selected="false">始终</button>
              </div>
            </div>
          </div>
          <label class="row" for="approvalsEnabled">
            <span><span id="approvalLabel" class="label">审批通知</span><span id="approvalDescription" class="description">需要你审批权限或计划时显示提醒</span></span>
            <span class="switch"><input id="approvalsEnabled" type="checkbox"><span class="track" aria-hidden="true"></span></span>
          </label>
          <label class="row" for="questionsEnabled">
            <span><span id="questionLabel" class="label">问题通知</span><span id="questionDescription" class="description">任务需要你的输入才能继续时显示提醒</span></span>
            <span class="switch"><input id="questionsEnabled" type="checkbox"><span class="track" aria-hidden="true"></span></span>
          </label>
        </div>
        <div id="status" role="status" aria-live="polite">已保存</div>
      </section>
    </div>
  </main>
  <script>
    const api=window.dshShell;
    const turnModeButton=document.getElementById('turnModeButton');const turnModeList=document.getElementById('turnModeList');const turnModeValue=document.getElementById('turnModeValue');const turnOptions=[...turnModeList.querySelectorAll('[role="option"]')];const approvals=document.getElementById('approvalsEnabled');const questions=document.getElementById('questionsEnabled');const status=document.getElementById('status');let currentTurnMode='unfocused';let statusTimer;
    function localize(locale){const zh=locale.startsWith('zh');document.documentElement.lang=locale;document.title=zh?'桌面端设置':'Desktop Settings';document.querySelector('aside').setAttribute('aria-label',zh?'设置分类':'Settings categories');document.getElementById('desktopLabel').textContent=zh?'桌面端':'Desktop';document.getElementById('notificationsNav').textContent=zh?'通知':'Notifications';document.getElementById('title').textContent=zh?'通知':'Notifications';document.getElementById('turnLabel').textContent=zh?'任务完成通知':'Task completion notifications';document.getElementById('turnDescription').textContent=zh?'设置 DeepSeek Harness 完成任务时何时提醒你':"Set when DeepSeek Harness alerts you that it's finished";const modeLabels=zh?['从不','仅在窗口未聚焦时','始终']:['Never','Only when unfocused','Always'];turnOptions.forEach((option,index)=>option.textContent=modeLabels[index]);document.getElementById('approvalLabel').textContent=zh?'审批通知':'Approval notifications';document.getElementById('approvalDescription').textContent=zh?'需要你审批权限或计划时显示提醒':'Show alerts when permissions or plans require your approval';document.getElementById('questionLabel').textContent=zh?'问题通知':'Question notifications';document.getElementById('questionDescription').textContent=zh?'任务需要你的输入才能继续时显示提醒':'Show alerts when input is needed to continue';status.textContent=zh?'已保存':'Saved';setTurnMode(currentTurnMode)}
    function setTurnMode(value){const option=turnOptions.find(item=>item.dataset.value===value)??turnOptions[1];currentTurnMode=option.dataset.value;turnModeValue.textContent=option.textContent;for(const item of turnOptions)item.setAttribute('aria-selected',String(item===option))}
    function setMenuOpen(open){turnModeButton.setAttribute('aria-expanded',String(open));turnModeList.hidden=!open;if(open)(turnOptions.find(item=>item.dataset.value===currentTurnMode)??turnOptions[0]).focus()}
    function showSaved(){status.classList.add('visible');clearTimeout(statusTimer);statusTimer=setTimeout(()=>status.classList.remove('visible'),1200)}
    async function save(){const value=await api.updateNotificationPreferences({turnMode:currentTurnMode,approvalsEnabled:approvals.checked,questionsEnabled:questions.checked});setTurnMode(value.turnMode);approvals.checked=value.approvalsEnabled;questions.checked=value.questionsEnabled;showSaved()}
    turnModeButton.addEventListener('click',()=>setMenuOpen(turnModeList.hidden));turnModeButton.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();setMenuOpen(true)}});turnModeList.addEventListener('keydown',event=>{const active=turnOptions.indexOf(document.activeElement);if(event.key==='Escape'){event.preventDefault();setMenuOpen(false);turnModeButton.focus()}else if(event.key==='Tab')setMenuOpen(false);else if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();turnOptions[(active+(event.key==='ArrowDown'?1:-1)+turnOptions.length)%turnOptions.length].focus()}});for(const option of turnOptions)option.addEventListener('click',()=>{setTurnMode(option.dataset.value);setMenuOpen(false);turnModeButton.focus();void save()});document.addEventListener('pointerdown',event=>{if(!turnModeButton.parentElement.contains(event.target))setMenuOpen(false)});
    Promise.all([api.getBootstrap(),api.getNotificationPreferences()]).then(([bootstrap,value])=>{localize(bootstrap.locale);setTurnMode(value.turnMode);approvals.checked=value.approvalsEnabled;questions.checked=value.questionsEnabled;for(const control of [approvals,questions])control.addEventListener('change',()=>void save())});api.onBootstrap(value=>localize(value.locale));
  </script>
</body>
</html>
