<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DSH Codex Desktop</title>
  <link rel="icon" type="image/png" href="./icon.png">
  <script>document.documentElement.dataset.colorScheme=new URLSearchParams(location.search).get('theme')==='light'?'light':'dark'</script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1115;
      color: #f3f4f6;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      animation: fade-in .45s ease both;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, .12);
      border-top-color: #6ea8ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    #msg {
      margin: 0;
      max-width: 420px;
      color: #9aa3af;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      white-space: pre-wrap;
    }
    :root[data-color-scheme="light"]{color-scheme:light}
    :root[data-color-scheme="light"] body{background:#fff;color:#0f1115}
    :root[data-color-scheme="light"] .icon{box-shadow:0 12px 32px rgba(15,17,21,.18)}
    :root[data-color-scheme="light"] .spinner{border-color:rgba(15,17,21,.12);border-top-color:#4176e6}
    :root[data-color-scheme="light"] #msg{color:#61666b}
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img class="icon" src="./icon.png" alt="DSH Codex Desktop">
    <div class="spinner" aria-hidden="true"></div>
    <p id="msg">加载中</p>
  </main>
</body>
</html>
