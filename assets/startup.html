<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DSH Codex Desktop</title>
  <link rel="icon" type="image/png" href="./icon.png">
  <script>document.documentElement.dataset.colorScheme=new URLSearchParams(location.search).get('theme')==='light'?'light':'dark'</script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1115;
      color: #f3f4f6;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      animation: fade-in .45s ease both;
    }
    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .progress-area { width: min(360px, calc(100vw - 48px)); }
    progress { display: block; width: 100%; height: 6px; border: 0; border-radius: 4px; overflow: hidden; accent-color: #6ea8ff; }
    progress::-webkit-progress-bar { background: rgba(128,140,160,.2); border-radius: 4px; }
    progress::-webkit-progress-value { background: #6ea8ff; border-radius: 4px; transition: width .15s; }
    progress:indeterminate { background: linear-gradient(90deg,transparent,#6ea8ff,transparent) 0 0 / 45% 100% no-repeat rgba(128,140,160,.2); animation: working 1.6s ease-in-out infinite alternate; }
    progress:indeterminate::-webkit-progress-bar { background: transparent; }
    .meta { display: flex; justify-content: space-between; margin-top: 10px; color: #9aa3af; font-size: 12px; font-variant-numeric: tabular-nums; }
    #detail { min-height: 20px; margin-top: 10px; color: #9aa3af; font-size: 12px; text-align: center; }
    body[data-failed="true"] progress { display: none; }
    body[data-failed="true"] .spinner { animation: none; border-color: #e58686; }
    @keyframes working { from { background-position: 0 0; } to { background-position: 100% 0; } }
    @media (prefers-reduced-motion: reduce) { .stage, .spinner, progress:indeterminate { animation: none; } }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, .12);
      border-top-color: #6ea8ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    #msg {
      margin: 0;
      max-width: 420px;
      color: #9aa3af;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      white-space: pre-wrap;
    }
    :root[data-color-scheme="light"]{color-scheme:light}
    :root[data-color-scheme="light"] body{background:#fff;color:#0f1115}
    :root[data-color-scheme="light"] .icon{box-shadow:0 12px 32px rgba(15,17,21,.18)}
    :root[data-color-scheme="light"] .spinner{border-color:rgba(15,17,21,.12);border-top-color:#4176e6}
    :root[data-color-scheme="light"] #msg{color:#61666b}
    :root[data-color-scheme="light"] .meta,:root[data-color-scheme="light"] #detail{color:#61666b}
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img class="icon" src="./icon.png" alt="DSH Codex Desktop">
    <div class="spinner" aria-hidden="true"></div>
    <section class="status" role="status" aria-live="polite" aria-atomic="true">
      <h1>DSH Codex Desktop</h1>
      <p id="msg">正在启动</p>
    </section>
    <div class="progress-area">
      <progress id="progress" aria-label="当前步骤进度"></progress>
      <div class="meta"><span id="percentage">正在处理</span><span id="elapsed"></span></div>
      <div id="detail"></div>
    </div>
  </main>
  <script>
    const rawLang = new URLSearchParams(location.search).get('lang') || navigator.language
    const norm = (rawLang || '').toLowerCase().split('-')[0]
    function pickLocale(map) { return map[norm] || (norm.startsWith('zh') ? map.zh : map.en) }
    document.documentElement.lang = rawLang
    const started = Date.now()
    let stoppedAt
    const bar = document.getElementById('progress')
    bar.setAttribute('aria-label', pickLocale({
      zh: '当前步骤进度',
      en: 'Current step progress',
      ja: '現在のステップの進捗',
      es: 'Progreso del paso actual',
      fr: 'Progression de l\'étape actuelle',
      de: 'Fortschritt des aktuellen Schritts',
      ru: 'Прогресс текущего шага',
      pt: 'Progresso da etapa atual',
    }))
    window.updateStartupProgress = (state) => {
      document.getElementById('msg').textContent = state.message
      document.getElementById('detail').textContent = state.detail || ''
      const measured = Number.isFinite(state.completed) && Number.isFinite(state.total) && state.total > 0 && state.completed >= 0 && state.completed <= state.total
      if (measured) { bar.max = state.total; bar.value = state.completed }
      else { bar.removeAttribute('value') }
      const failed = state.failed === true
      document.body.dataset.failed = String(failed)
      stoppedAt = failed ? Date.now() : undefined
      const stepPrefix = pickLocale({
        zh: '当前步骤',
        en: 'Current step',
        ja: '現在のステップ',
        es: 'Paso actual',
        fr: 'Étape actuelle',
        de: 'Aktueller Schritt',
        ru: 'Текущий шаг',
        pt: 'Etapa atual',
      })
      document.getElementById('percentage').textContent = failed ? pickLocale({
        zh: '启动未完成',
        en: 'Startup incomplete',
        ja: '起動が未完了です',
        es: 'Inicio incompleto',
        fr: 'Démarrage incomplet',
        de: 'Start unvollständig',
        ru: 'Запуск не завершен',
        pt: 'Inicialização incompleta',
      }) : measured ? `${stepPrefix} ${Math.floor(state.completed / state.total * 100)}%`
        : pickLocale({
          zh: '正在处理',
          en: 'Working',
          ja: '処理中',
          es: 'Procesando',
          fr: 'Traitement en cours',
          de: 'In Bearbeitung',
          ru: 'Обработка',
          pt: 'Processando',
        })
    }
    const updateElapsed = () => {
      const seconds = Math.floor(((stoppedAt || Date.now()) - started) / 1000)
      document.getElementById('elapsed').textContent = pickLocale({
        zh: `已用时 ${seconds} 秒`,
        en: `${seconds}s elapsed`,
        ja: `経過時間: ${seconds}秒`,
        es: `${seconds}s transcurridos`,
        fr: `${seconds} s écoulées`,
        de: `${seconds}s vergangen`,
        ru: `Прошло ${seconds} с`,
        pt: `${seconds}s decorridos`,
      })
    }
    setInterval(updateElapsed, 1000)
    updateElapsed()
    window.updateStartupProgress({ message: zh ? '正在启动' : 'Starting' })
  </script>
</body>
</html>
